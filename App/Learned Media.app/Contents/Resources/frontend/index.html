<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf7ff" />
    <title>Learned Media</title>
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .native-shell { min-height: 100vh; }
      .native-loading { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }
      .native-error { max-width: 560px; margin: 15vh auto; padding: 28px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); color: var(--ink); }
      .native-error h1 { margin: 0 0 9px; color: var(--ink-strong); }
      .native-error p { line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="app" class="native-shell">
      <div class="native-loading">Opening your learning space…</div>
    </div>
    <script src="topic-catalog.js"></script>
    <script src="youtube-catalog.js"></script>
    <script src="app.js"></script>
  </body>
</html>
